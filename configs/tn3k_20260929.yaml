dataset: tn3k
seed: 20260929
input_size: 512
cpu_threads: 2
determinism: strict
training:
  epochs: 100
  batch_size: 4
  accumulation_steps: 2
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  clip_grad_norm: 100.0
  scheduler: cosine
  warmup_steps: 1620
  min_lr: 1.0e-06
  loss: bce_dice
  bce_weight: 1.0
  dice_weight: 1.0
  validate_every: 1620
  checkpoint_every: 324
augmentation:
  horizontal_flip: 0.5
  brightness: 0.1
  contrast: 0.1
runtime:
  precision: bf16
  workers: 2
  prefetch_factor: 2
  pin_memory: true
  validation_batch_size: 1
  overflow_retries: 5
model: ASNI-Net
initialization: scratch_exact
split_file: splits/tn3k.csv
early_stopping:
  min_epochs: 60
  patience_epochs: 20
  min_delta: 0.001
